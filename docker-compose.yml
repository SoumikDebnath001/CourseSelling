services:
  # ── Backend (Express API) ─────────────────────────────
  backend:
    image: ${DOCKER_USERNAME}/courses-backend:latest
    container_name: courses-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      # ── Pesapal payment gateway (values come from .env via env_file; listed
      # here explicitly so the compose file documents what the backend needs) ──
      PESAPAL_CONSUMER_KEY: ${PESAPAL_CONSUMER_KEY:-}
      PESAPAL_CONSUMER_SECRET: ${PESAPAL_CONSUMER_SECRET:-}
      PESAPAL_ENV: ${PESAPAL_ENV:-sandbox}
      PESAPAL_CURRENCY: ${PESAPAL_CURRENCY:-KES}
      PESAPAL_IPN_URL: ${PESAPAL_IPN_URL:-}
      PESAPAL_IPN_ID: ${PESAPAL_IPN_ID:-}
      PESAPAL_CALLBACK_URL: ${PESAPAL_CALLBACK_URL:-}
    # Bind to loopback only: the API must be reached through the Nginx TLS proxy,
    # never directly on the host's public interface.
    ports:
      - "127.0.0.1:4000:4000"

  # ── Frontend (Next.js) ────────────────────────────────
  frontend:
    image: ${DOCKER_USERNAME}/courses-frontend:latest
    container_name: courses-frontend
    restart: unless-stopped
    # Loopback only — public traffic terminates at Nginx (TLS) and is proxied in.
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - backend
